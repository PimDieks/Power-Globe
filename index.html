<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Power Globe</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="globe"></div>

    <details class="panel" id="controls" open>
      <summary><h1>Power Globe</h1></summary>
      <div class="button-row" id="layer-buttons" role="radiogroup" aria-label="Weather layer"></div>
      <div id="legend" aria-live="polite"></div>

      <h2>Display</h2>
      <div class="button-row" id="mode-buttons" role="radiogroup" aria-label="Display style"></div>
      <label class="toggle"><input type="checkbox" id="toggle-wind" checked /> Wind flow</label>
      <label class="toggle"><input type="checkbox" id="toggle-hazards" checked /> Storms &amp; heavy precipitation</label>
      <div id="pattern-legend"></div>

      <div class="status-row">
        <span id="status">Loading forecast…</span>
        <button id="refresh" type="button">Refresh</button>
      </div>
    </details>

    <aside class="panel hidden" id="details" aria-live="polite"></aside>

    <div class="panel" id="timeline">
      <button id="play" type="button" aria-label="Play forecast" disabled>▶</button>
      <input type="range" id="time-slider" min="0" max="0" value="0" step="1" aria-label="Forecast time" disabled />
      <span id="time-label">–</span>
      <button id="now" type="button" disabled>Now</button>
    </div>

    <div id="caption" aria-live="off"></div>

    <footer class="attribution">
      Weather by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (CC BY 4.0) ·
      Imagery <a href="https://www.esri.com/" target="_blank" rel="noopener">Esri</a>, Maxar, Earthstar Geographics
      and the GIS User Community; NASA Blue Marble ·
      Borders <a href="https://www.naturalearthdata.com/" target="_blank" rel="noopener">Natural Earth</a>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
