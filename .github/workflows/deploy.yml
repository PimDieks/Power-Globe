name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild every six hours so the site's own data (forecast, airport weather, satellite
  # elements) stays fresh.
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # A fallback copy of the satellite elements; the site works without it.
      - run: npm run satellites
        continue-on-error: true
      # The site's own data API (forecast and airport weather); the site works without it.
      - run: npm run data
        continue-on-error: true
      - run: npm run build
        env:
          # The Power Globe API (api/worker.js), if one is deployed: set the repository variable
          # API_URL to its address, e.g. https://power-globe-api.<account>.workers.dev
          VITE_API_URL: ${{ vars.API_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
