name: Deploy the Power Globe API

# Deploys api/worker.js to Cloudflare Workers. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN   an API token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  the account ID shown in the Cloudflare dashboard
# Without them this workflow does nothing. Optionally, for an OpenSky Network account's larger
# allowance of worldwide flights, two more (from the account's API client, credentials.json):
#   OPENSKY_CLIENT_ID      its clientId
#   OPENSKY_CLIENT_SECRET  its clientSecret

on:
  push:
    branches: [main]
    paths: ['api/**', '.github/workflows/api.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - id: check
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: echo "ready=${{ env.TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready != 'true'
        run: echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the Power Globe API."
      - if: steps.check.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: api
      # Hand the OpenSky account to the API as Worker secrets (kept encrypted by Cloudflare).
      - if: steps.check.outputs.ready == 'true'
        name: Store the OpenSky account
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: |
          if [ -z "$OPENSKY_CLIENT_ID" ] || [ -z "$OPENSKY_CLIENT_SECRET" ]; then
            echo "::notice::No OPENSKY_CLIENT_ID and OPENSKY_CLIENT_SECRET secrets: the API asks OpenSky anonymously."
            exit 0
          fi
          printf '%s' "$OPENSKY_CLIENT_ID" | npx --yes wrangler@3 secret put OPENSKY_CLIENT_ID
          printf '%s' "$OPENSKY_CLIENT_SECRET" | npx --yes wrangler@3 secret put OPENSKY_CLIENT_SECRET
      # Try every route as the site would, and print what each answers, so problems with the
      # services behind it show up in this log.
      - if: steps.check.outputs.ready == 'true'
        name: Check the API
        continue-on-error: true
        run: |
          sleep 10
          base=https://power-globe-api.pimdieks.workers.dev
          for path in / /flights/global "/flights/area?lat=52.3&lon=4.76&nm=50" /flights/military "/metar?ids=EHAM" /satellites/stations "/forecast?latitude=52.3&longitude=4.76&hourly=temperature_2m&forecast_days=1"; do
            code=$(curl -s -o /tmp/body -w '%{http_code}' -H 'Origin: https://pimdieks.github.io' "$base$path")
            echo "$code $path :: $(head -c 300 /tmp/body | tr '\n' ' ')"
          done

